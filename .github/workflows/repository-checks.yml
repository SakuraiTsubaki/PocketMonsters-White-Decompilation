name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository policy
        run: python scripts/check_repository.py .
      - name: Compile defect audit tools
        run: python -m py_compile tools/rom_audit.py tools/compare_nds.py tools/defect_gate.py
      - name: Smoke-test defect audit CLIs
        run: |
          python tools/rom_audit.py --help >/dev/null
          python tools/compare_nds.py --help >/dev/null
          python tools/defect_gate.py --help >/dev/null
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
